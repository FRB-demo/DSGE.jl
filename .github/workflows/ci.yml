name: CI
on: [push, pull_request]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
            - '1.10'
            - '1.11'
        arch:
            - x64
        os:
            - ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: "Install unregistered NY Fed dependency versions from source"
        run: |
          julia -e '
            using Pkg
            Pkg.add(url="https://github.com/FRBNY-DSGE/ModelConstructors.jl.git")
            Pkg.add(url="https://github.com/FRBNY-DSGE/SMC.jl.git")
            Pkg.add(url="https://github.com/FRBNY-DSGE/StateSpaceRoutines.jl.git")
          '
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
